<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APS 自动排产系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>APS 自动排产</h1>
    <span class="sub" id="problemName">车间排产 · 柔性作业车间 (FJSP)</span>
  </div>
  <div class="summary" id="summary"></div>
  <div class="actions">
    <select id="algo" title="求解算法">
      <option value="auto">自动(规则+GA取优)</option>
      <option value="ga" selected>遗传算法 GA</option>
      <option value="rule">规则法(7条规则取最优)</option>
    </select>
    <select id="budget" title="求解时间预算">
      <option value="300">300 ms</option>
      <option value="800">800 ms</option>
      <option value="2000" selected>2 s</option>
      <option value="5000">5 s</option>
    </select>
    <button id="btnSolve" class="primary">开始排产</button>
    <button id="btnReset" class="ghost">重置演示数据</button>
    <button id="btnConfig" class="ghost">日历配置</button>
  </div>
</header>

<main>
  <section class="kpis" id="kpis"></section>

  <section class="card">
    <div class="card-head">
      <h2>设备甘特图</h2>
      <div class="legend" id="legend"></div>
      <div class="spacer"></div>
      <div class="seg" id="zoom">
        <button data-zoom="14">紧凑</button>
        <button data-zoom="26" class="on">标准</button>
        <button data-zoom="52">宽松</button>
      </div>
    </div>
    <div class="gantt-wrap">
      <div class="gantt" id="gantt">
        <div class="empty" id="ganttEmpty">还没有排产结果，点右上角「开始排产」</div>
      </div>
    </div>
    <div class="tipbar" id="ganttTip">方块=一道工序；浅色段=换型准备时间，蓝色竖线=当前时刻。鼠标悬停看明细。</div>
  </section>

  <div class="cols">
    <section class="card">
      <div class="card-head"><h2>订单交付</h2><span class="hint" id="orderHint"></span></div>
      <div class="table-wrap"><table id="orderTable">
        <thead><tr>
          <th>订单</th><th>产品</th><th class="n">数量</th><th class="n">优先级</th>
          <th>交期</th><th>预计完工</th><th class="n">延期(h)</th><th>状态</th>
        </tr></thead>
        <tbody></tbody>
      </table></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>设备负荷</h2></div>
      <div class="util" id="util"></div>
    </section>
  </div>

  <div class="cols">
    <section class="card">
      <div class="card-head">
        <h2>动态事件</h2>
        <div class="spacer"></div>
        <button class="ghost sm" id="btnInsert">插入急单</button>
        <button class="ghost sm" id="btnDown">设备故障</button>
        <button class="ghost sm" id="btnBench">跑性能基准</button>
      </div>
      <ul class="events" id="events"><li class="muted">暂无事件</li></ul>
    </section>

    <section class="card">
      <div class="card-head"><h2>性能基准 (规则法 vs 遗传算法)</h2></div>
      <div class="table-wrap"><table id="benchTable">
        <thead><tr>
          <th class="n">订单</th><th class="n">工序</th><th class="n">设备</th>
          <th class="n">规则(ms)</th><th class="n">GA(ms)</th>
          <th class="n">规则目标</th><th class="n">GA目标</th><th class="n">提升</th>
        </tr></thead>
        <tbody><tr><td colspan="8" class="muted">点「跑性能基准」生成对照数据</td></tr></tbody>
      </table></div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">插入急单</h3>
    <div id="modalBody" class="form"></div>
    <div class="modal-foot">
      <button class="ghost" id="modalCancel">取消</button>
      <button class="primary" id="modalOk">确定</button>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script src="app.js"></script>
</body>
</html>
